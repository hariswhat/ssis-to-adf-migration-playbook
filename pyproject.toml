[project]
name = "ssis-to-adf-migration-playbook"
version = "0.1.0"
description = "Assess, plan, convert and reconcile an SSIS estate moving to Azure Data Factory"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# The sample estate writes .dtsx XML and SQL literals that read better unwrapped.
"tools/make_sample_estate.py" = ["E501"]
