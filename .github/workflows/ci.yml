name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: sqlfluff lint sql/procedures
      - run: python -m pytest
      # fails on any reconciliation difference not in reconciliation/accepted.yml
      - run: python -m playbook.reconcile
